apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      jellyfin:
        type: statefulset
        containers:
          jellyfin:
            image:
              repository: ghcr.io/jellyfin/jellyfin
              tag: 10.11.2
            env:
              TZ: Europe/Dublin
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8096
            resources:
              claims:
              - name: gpu
              requests:
                cpu: 200m
                memory: 1Gi
        pod:
          resourceClaims:
          - name: gpu
            resourceClaimTemplateName: gpu
        statefulset:
          volumeClaimTemplates:
          - name: config
            size: 10Gi
            storageClass: proxmox
            accessMode: ReadWriteOnce
            labels:
              cluster-destroy-delete: "true"
            globalMounts:
            - path: /config
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
        - path: /metadata
          subPath: jellyfin/metadata
        - path: /movies
          readOnly: true
          subPath: movies
        - path: /shows
          readOnly: true
          subPath: shows
    rawResources:
      resourceClaimTemplate:
        forceRename: gpu
        manifest:
          apiVersion: resource.k8s.io/v1
          kind: ResourceClaimTemplate
          spec:
            spec:
              devices:
                requests:
                - name: gpu
                  exactly:
                    deviceClassName: gpu.intel.com
      scaledObject:
        forceRename: jellyfin
        manifest:
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          spec:
            scaleTargetRef:
              kind: StatefulSet
              name: jellyfin
            triggers:
            - type: cron
              metadata:
                timezone: Europe/Dublin
                start: 10 04 * * *
                end: 50 03 * * *
                desiredReplicas: "1"
    route:
      jellyfin:
        hostnames:
        - jellyfin.cecobask.com
        parentRefs:
        - name: envoy
          namespace: envoy-gateway
        rules:
        - backendRefs:
          - port: 80
          timeouts:
            request: 3h
    service:
      jellyfin:
        controller: jellyfin
        clusterIP: None
        ports:
          http:
            port: 80
            targetPort: 8096
