apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      profilarr:
        type: statefulset
        containers:
          profilarr:
            image:
              repository: ghcr.io/dictionarry-hub/profilarr
              tag: 2.2.0
            env:
              ORIGIN: https://profilarr.cecobask.com
              TZ: Europe/Dublin
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 6868
            resources:
              requests:
                cpu: 100m
                memory: 500Mi
        statefulset:
          volumeClaimTemplates:
          - name: config
            size: 1Gi
            storageClass: proxmox
            accessMode: ReadWriteOnce
            labels:
              cluster-destroy-delete: "true"
            globalMounts:
            - path: /config
    rawResources:
      scaledObject:
        manifest:
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          metadata:
            name: profilarr
          spec:
            scaleTargetRef:
              kind: StatefulSet
              name: profilarr
            triggers:
            - type: cron
              metadata:
                timezone: Europe/Dublin
                start: 10 04 * * *
                end: 50 03 * * *
                desiredReplicas: "1"
    route:
      profilarr:
        hostnames:
        - profilarr.cecobask.com
        parentRefs:
        - name: envoy
          namespace: envoy-gateway
        rules:
        - backendRefs:
          - port: 80
          timeouts:
            request: 30s
    service:
      profilarr:
        controller: profilarr
        clusterIP: None
        ports:
          http:
            port: 80
            targetPort: 6868
