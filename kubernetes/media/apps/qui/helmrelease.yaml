apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      qui:
        type: statefulset
        containers:
          qui:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.7.0
            env:
              TZ: Europe/Dublin
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/liveness
                    port: 7476
            resources:
              requests:
                cpu: 10m
                memory: 150Mi
        statefulset:
          volumeClaimTemplates:
          - name: config
            size: 1Gi
            storageClass: proxmox
            accessMode: ReadWriteOnce
            labels:
              cluster-destroy-delete: "true"
            globalMounts:
            - path: /config
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
        - path: /torrents
          subPath: torrents
    rawResources:
      scaledObject:
        manifest:
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          metadata:
            name: qui
          spec:
            scaleTargetRef:
              kind: StatefulSet
              name: qui
            triggers:
            - type: cron
              metadata:
                timezone: Europe/Dublin
                start: 10 04 * * *
                end: 50 03 * * *
                desiredReplicas: "1"
    service:
      qui:
        controller: qui
        clusterIP: None
        ports:
          http:
            port: 80
            targetPort: 7476
    route:
      qui:
        hostnames:
        - qui.cecobask.com
        parentRefs:
        - name: envoy
          namespace: envoy-gateway
        rules:
        - backendRefs:
          - port: 80
          timeouts:
            request: 30s
