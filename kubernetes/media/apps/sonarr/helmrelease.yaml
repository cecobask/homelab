apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      sonarr:
        type: statefulset
        containers:
          sonarr:
            image:
              repository: ghcr.io/home-operations/sonarr
              tag: 4.0.20
            env:
              TZ: Europe/Dublin
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 8989
            resources:
              requests:
                cpu: 300m
                memory: 350Mi
        statefulset:
          volumeClaimTemplates:
          - name: config
            size: 5Gi
            storageClass: proxmox
            accessMode: ReadWriteOnce
            labels:
              cluster-destroy-delete: "true"
            globalMounts:
            - path: /config
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
        - path: /config/MediaCover
          subPath: sonarr/MediaCover
        - path: /shows
          subPath: shows
        - path: /torrents/shows
          subPath: torrents/shows
    rawResources:
      scaledObject:
        manifest:
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          metadata:
            name: sonarr
          spec:
            scaleTargetRef:
              kind: StatefulSet
              name: sonarr
            triggers:
            - type: cron
              metadata:
                timezone: Europe/Dublin
                start: 10 04 * * *
                end: 50 03 * * *
                desiredReplicas: "1"
    route:
      sonarr:
        hostnames:
        - sonarr.cecobask.com
        parentRefs:
        - name: envoy
          namespace: envoy-gateway
        rules:
        - backendRefs:
          - port: 80
          timeouts:
            request: 3h
    service:
      sonarr:
        controller: sonarr
        clusterIP: None
        ports:
          http:
            port: 80
            targetPort: 8989
