apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      audiobookshelf:
        type: statefulset
        containers:
          audiobookshelf:
            image:
              repository: ghcr.io/advplyr/audiobookshelf
              tag: 2.36.1
            env:
              TZ: Europe/Dublin
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: 80
            resources:
              requests:
                cpu: 100m
                memory: 500Mi
        statefulset:
          volumeClaimTemplates:
          - name: config
            size: 10Gi
            storageClass: proxmox
            accessMode: ReadWriteOnce
            labels:
              cluster-destroy-delete: "true"
            globalMounts:
            - path: /config
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
        - path: /audiobooks
          subPath: audiobooks
        - path: /books
          subPath: books
    rawResources:
      scaledObject:
        manifest:
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          metadata:
            name: audiobookshelf
          spec:
            scaleTargetRef:
              kind: StatefulSet
              name: audiobookshelf
            triggers:
            - type: cron
              metadata:
                timezone: Europe/Dublin
                start: 10 04 * * *
                end: 50 03 * * *
                desiredReplicas: "1"
    route:
      audiobookshelf:
        hostnames:
        - audiobookshelf.cecobask.com
        parentRefs:
        - name: envoy
          namespace: envoy-gateway
        rules:
        - backendRefs:
          - port: 80
          timeouts:
            request: 30s
    service:
      audiobookshelf:
        controller: audiobookshelf
        clusterIP: None
        ports:
          http:
            port: 80
