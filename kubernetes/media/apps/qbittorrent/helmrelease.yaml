apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      qbittorrent:
        type: statefulset
        containers:
          qbittorrent:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.1.4
            env:
              TZ: Europe/Dublin
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    port: 8080
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                    - pidof
                    - qbittorrent-nox
            resources:
              requests:
                cpu: 700m
                memory: 1Gi
        statefulset:
          volumeClaimTemplates:
          - name: config
            size: 1Gi
            storageClass: proxmox
            accessMode: ReadWriteOnce
            labels:
              cluster-destroy-delete: "true"
            globalMounts:
            - path: /config
    persistence:
      media:
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
        - path: /torrents
          subPath: torrents
    rawResources:
      scaledObject:
        manifest:
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          metadata:
            name: qbittorrent
          spec:
            scaleTargetRef:
              kind: StatefulSet
              name: qbittorrent
            triggers:
            - type: cron
              metadata:
                timezone: Europe/Dublin
                start: 10 04 * * *
                end: 50 03 * * *
                desiredReplicas: "1"
    service:
      qbittorrent:
        controller: qbittorrent
        clusterIP: None
        ports:
          http:
            port: 80
            targetPort: 8080
      listening:
        controller: qbittorrent
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.40.4
        ports:
          tcp:
            port: 40404
            protocol: TCP
          udp:
            port: 40404
            protocol: UDP
    route:
      qbittorrent:
        hostnames:
        - qbit.cecobask.com
        parentRefs:
        - name: envoy
          namespace: envoy-gateway
        rules:
        - backendRefs:
          - identifier: qbittorrent
            port: 80
          timeouts:
            request: 30s
