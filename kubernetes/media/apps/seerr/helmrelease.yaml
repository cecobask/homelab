apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      seerr:
        type: statefulset
        containers:
          seerr:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.1.0
            env:
              TZ: Europe/Dublin
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: 5055
            resources:
              requests:
                cpu: 50m
                memory: 300Mi
        statefulset:
          volumeClaimTemplates:
          - name: config
            size: 5Gi
            storageClass: proxmox
            accessMode: ReadWriteOnce
            labels:
              cluster-destroy-delete: "true"
            globalMounts:
            - path: /app/config
    rawResources:
      scaledObject:
        manifest:
          apiVersion: keda.sh/v1alpha1
          kind: ScaledObject
          metadata:
            name: seerr
          spec:
            scaleTargetRef:
              kind: StatefulSet
              name: seerr
            triggers:
            - type: cron
              metadata:
                timezone: Europe/Dublin
                start: 10 04 * * *
                end: 50 03 * * *
                desiredReplicas: "1"
    route:
      seerr:
        hostnames:
        - seerr.cecobask.com
        parentRefs:
        - name: envoy
          namespace: envoy-gateway
        rules:
        - backendRefs:
          - port: 80
          timeouts:
            request: 3h
    service:
      seerr:
        controller: seerr
        clusterIP: None
        ports:
          http:
            port: 80
            targetPort: 5055
