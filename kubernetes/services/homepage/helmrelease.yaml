apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: media
  interval: 1h
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      homepage:
        containers:
          homepage:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v1.13.2
            env:
              HOMEPAGE_ALLOWED_HOSTS: homelab.cecobask.com
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    httpHeaders:
                    - name: Host
                      value: homelab.cecobask.com
                    path: /api/healthcheck
                    port: 3000
            resources:
              requests:
                cpu: 80m
                memory: 150Mi
    persistence:
      config:
        type: configMap
        name: homepage
        globalMounts:
        - path: /app/config
      logs:
        type: emptyDir
        sizeLimit: 500Mi
        globalMounts:
        - path: /app/config/logs
    route:
      homepage:
        hostnames:
        - homelab.cecobask.com
        parentRefs:
        - name: envoy
          namespace: envoy-gateway
        rules:
        - backendRefs:
          - port: 80
          timeouts:
            request: 30s
    service:
      homepage:
        controller: homepage
        clusterIP: None
        ports:
          http:
            port: 80
            targetPort: 3000
