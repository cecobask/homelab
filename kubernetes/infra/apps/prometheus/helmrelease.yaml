apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  dependsOn:
  - name: csi-proxmox
    namespace: csi-proxmox
  - name: envoy-gateway
    namespace: envoy-gateway
  interval: 1h
  values:
    alertmanager:
      alertmanagerSpec:
        externalUrl: https://alertmanager.cecobask.com
        storage:
          volumeClaimTemplate:
            metadata:
              labels:
                cluster-destroy-delete: "true"
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
              storageClassName: proxmox
      route:
        main:
          enabled: true
          hostnames:
          - alertmanager.cecobask.com
          parentRefs:
          - name: envoy
            namespace: envoy-gateway
    cleanPrometheusOperatorObjectNames: true
    commonLabels:
      cluster: homelab
    coreDns:
      serviceMonitor:
        targetLabels:
        - cluster
    crds:
      enabled: false
    defaultRules:
      create: false
    fullnameOverride: prometheus
    grafana:
      enabled: false
    kubeControllerManager:
      serviceMonitor:
        targetLabels:
        - cluster
    kubeEtcd:
      service:
        selector:
          component: kube-scheduler
      serviceMonitor:
        targetLabels:
        - cluster
    kubelet:
      serviceMonitor:
        targetLabels:
        - cluster
    kubeProxy:
      enabled: false
    kubeScheduler:
      serviceMonitor:
        targetLabels:
        - cluster
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      customLabels:
        cluster: homelab
      prometheus:
        monitor:
          targetLabels:
          - cluster
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
    prometheus:
      prometheusSpec:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: topology.kubernetes.io/zone
                  operator: In
                  values: [ pve1 ]
        externalUrl: https://prometheus.cecobask.com
        resources:
          requests:
            cpu: 250m
            memory: 2.5Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            metadata:
              labels:
                cluster-destroy-delete: "true"
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 30Gi
              storageClassName: proxmox
    prometheusOperator:
      extraArgs:
      - --labels=cluster=homelab
      fullnameOverride: prometheus-operator
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
    prometheus-node-exporter:
      extraArgs:
      # default
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
      # additional
      - --collector.interrupts
      - --collector.processes
      - --collector.systemd
      - --collector.tcpstat
      fullnameOverride: prometheus-node-exporter
      prometheus:
        monitor:
          targetLabels:
          - cluster
      resources:
        requests:
          cpu: 50m
          memory: 50Mi
