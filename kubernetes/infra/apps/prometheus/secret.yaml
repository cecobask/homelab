apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
  namespace: prometheus
spec:
  refreshInterval: 0s
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  data:
  - secretKey: watchdogURL
    remoteRef:
      key: 0e113eae-dc33-4817-9f34-b5030156b51c
  target:
    template:
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          inhibit_rules:
          - equal:
            - namespace
            - alertname
            source_matchers:
            - severity = critical
            target_matchers:
            - severity =~ warning|info
          - equal:
            - namespace
            - alertname
            source_matchers:
            - severity = warning
            target_matchers:
            - severity = info
          - equal:
            - namespace
            source_matchers:
            - alertname = InfoInhibitor
            target_matchers:
            - severity = info
          - target_matchers:
            - alertname = InfoInhibitor
          receivers:
          - name: "null"
          - name: watchdog
            webhook_configs:
            - send_resolved: false
              url: {{ .watchdogURL }}
          route:
            group_by:
            - namespace
            group_interval: 10m
            group_wait: 1m
            receiver: "null"
            repeat_interval: 12h
            routes:
            - group_interval: 5m
              group_wait: 0s
              matchers:
              - alertname = "Watchdog"
              receiver: watchdog
              repeat_interval: 5m
          templates:
          - /etc/alertmanager/config/*.tmpl
