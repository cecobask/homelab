apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: victoria-logs
  namespace: victoria-metrics
spec:
  componentVersion: v1.52.0
  disableSelfServiceScrape: true
  retentionMaxDiskSpaceUsageBytes: 80GiB
  resources:
    requests:
      cpu: 150m
      memory: 500Mi
  retentionPeriod: 100y
  storage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 100Gi
    storageClassName: proxmox
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs
  namespace: victoria-metrics
spec:
  hostnames:
  - logs.cecobask.com
  parentRefs:
  - name: envoy
    namespace: envoy-gateway
  rules:
  - backendRefs:
    - name: vlsingle-victoria-logs
      port: 9428
