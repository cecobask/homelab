{{- range .Values.resourceClaims -}}
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  spec:
    devices:
      requests:
      - name: {{ .name }}
        exactly:
          deviceClassName: {{ .deviceClassName }}
---
{{- end }}
